name: Proxy-4 cold startup
on:
  push:
    branches: [ci/proxy4-cold]
  workflow_dispatch:
jobs:
  cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Measure cold startup on one runner
        shell: bash
        run: |
          set -euo pipefail
          run_cold() {
            local label=$1
            shift
            mkdir -p "results/$label"
            mvn -B -ntp -q clean compile "$@"
            mvn -B -ntp -q dependency:build-classpath -Dmdep.outputFile=target/cp.txt "$@"
            java -cp "target/classes:$(cat target/cp.txt)" org.openjdk.jmh.Main \
              'CdiColdStartBenchmark.*' -f 10 -wi 0 -i 1 -t 1 -bm ss -tu ms \
              -rf json -rff "results/$label/jmh-cold.json"
          }
          run_cold owb-4.1.1 -POWB -Dowb.version=4.1.1
          run_cold weld-7.0.0 -PWeld -Dweld.version=7.0.0.Final
          run_cold weld-6.0.4 -PWeld -Dweld.version=6.0.4.Final
          while IFS='=' read -r label ref; do
            version=$(scripts/build-weld.sh https://github.com/AngeloRubens/core "$ref" | tail -1)
            run_cold "$label" -PWeld -Dweld.version="$version"
          done < .github/weld-refs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-start-results
          path: results/
