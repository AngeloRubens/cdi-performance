name: CDI benchmark

on:
  push:
    # jakarta-2026: full run; ci/bench-quick: quick run (both also benchmark the patched Weld branch)
    branches: [ jakarta-2026, ci/bench-quick ]
  workflow_dispatch:
    inputs:
      weld_repo:
        description: 'Git repository of a patched Weld to benchmark as well (empty = skip)'
        default: 'https://github.com/AngeloRubens/core'
      weld_ref:
        description: 'Branch of the patched Weld'
        default: 'perf/client-proxy'
      quick:
        description: 'Quick mode: JMH only, 1 thread, no Weld 6 / legacy / boot'
        type: boolean
        default: false

jobs:
  bench:
    # all implementations run sequentially on the same runner so the numbers are comparable
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      WELD_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.weld_repo || 'https://github.com/AngeloRubens/core' }}
      WELD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.weld_ref || 'perf/client-proxy' }}
      QUICK: ${{ inputs.quick == true || github.ref == 'refs/heads/ci/bench-quick' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Environment
        run: |
          java -version
          mvn -v
          nproc
          lscpu | grep 'Model name'
          if [ "$QUICK" = true ]; then
            echo "LEGACY=0" >> "$GITHUB_ENV"; echo "BOOT=0" >> "$GITHUB_ENV"; echo "THREADS=1" >> "$GITHUB_ENV"
          fi
      - name: Build patched Weld (${{ env.WELD_REF }})
        if: env.WELD_REPO != ''
        continue-on-error: true
        run: echo "PATCHED_WELD=$(scripts/build-weld.sh "$WELD_REPO" "$WELD_REF" | tail -1)" >> "$GITHUB_ENV"
      - name: OpenWebBeans 4.1.1 (CDI 4.1)
        run: scripts/bench.sh owb-4.1.1 -POWB -Dowb.version=4.1.1
      - name: Weld 6.0.4.Final (CDI 4.1)
        if: env.QUICK != 'true'
        run: scripts/bench.sh weld-6.0.4 -PWeld -Dweld.version=6.0.4.Final
      - name: Weld 7.0.0.Final (CDI 5.0)
        run: scripts/bench.sh weld-7.0.0 -PWeld -Dweld.version=7.0.0.Final
      - name: Weld patched (${{ env.PATCHED_WELD }})
        if: env.PATCHED_WELD != ''
        run: scripts/bench.sh weld-7-patched -PWeld -Dweld.version=$PATCHED_WELD
      - name: Report
        if: always()
        run: scripts/report.py results | tee -a "$GITHUB_STEP_SUMMARY" > results/REPORT.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: results/
