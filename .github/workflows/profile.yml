name: CDI profiling

on:
  push:
    branches: [ ci/profile ]
  workflow_dispatch:
    inputs:
      weld_repo:
        description: 'Git repository of a patched Weld to profile as well (empty = skip)'
        default: 'https://github.com/AngeloRubens/core'
      weld_ref:
        description: 'Branch of the patched Weld'
        default: 'perf/client-proxy'
      benchmarks:
        description: 'JMH benchmarks to profile'
        default: 'applicationScoped requestScoped methodIntercepted'

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROFILE_BENCHMARKS: ${{ inputs.benchmarks || 'applicationScoped requestScoped methodIntercepted' }}
      WELD_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.weld_repo || 'https://github.com/AngeloRubens/core' }}
      WELD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.weld_ref || 'perf/client-proxy' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: async-profiler
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=1 kernel.kptr_restrict=0
          curl -sSL https://github.com/async-profiler/async-profiler/releases/download/v4.5/async-profiler-4.5-linux-x64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "ASYNC_PROFILER=$(ls $RUNNER_TEMP/async-profiler-*/lib/libasyncProfiler.so)" >> "$GITHUB_ENV"
      - name: Build patched Weld
        if: env.WELD_REPO != ''
        continue-on-error: true
        run: echo "PATCHED_WELD=$(scripts/build-weld.sh "$WELD_REPO" "$WELD_REF" | tail -1)" >> "$GITHUB_ENV"
      - name: Profile Weld 7.0.0.Final
        run: scripts/profile.sh weld-7.0.0 -PWeld -Dweld.version=7.0.0.Final
      - name: Profile patched Weld
        if: env.PATCHED_WELD != ''
        run: scripts/profile.sh weld-7-patched -PWeld -Dweld.version=$PATCHED_WELD
      - name: Profile OpenWebBeans 4.1.1
        run: scripts/profile.sh owb-4.1.1 -POWB -Dowb.version=4.1.1
      - name: Summary
        if: always()
        run: |
          for d in results/profile-*; do
            echo "## $d" >> "$GITHUB_STEP_SUMMARY"
            { echo '```'; grep -hE '^CdiBenchmark\.\w+(:gc\.alloc\.rate\.norm)? ' $d/gc-*.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
            for f in $(find $d -name 'collapsed*' -o -name '*.collapsed' | sort); do scripts/stacks.py "$f" 20 >> "$GITHUB_STEP_SUMMARY"; done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profiles
          path: results/
